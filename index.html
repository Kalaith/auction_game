<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>Auction House Tycoon</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0d1113;
        }

        body {
            display: grid;
            place-items: center;
        }

        .game-shell {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at center, rgba(39, 50, 52, 0.72), transparent 58%),
                #0d1113;
        }

        .game-container {
            position: relative;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            image-rendering: auto;
        }

    </style>
</head>

<body>
    <main class="game-shell">
        <div class="game-container" id="game-container">
            <canvas id="glcanvas" tabindex="1" width="1200" height="675"></canvas>
        </div>
    </main>

    <script src="mq_js_bundle.js"></script>
    <script>
        load("auction_game.wasm");
        document.getElementById("glcanvas").focus();
        window.addEventListener("click", () => document.getElementById("glcanvas").focus());
    </script>
</body>

</html>
